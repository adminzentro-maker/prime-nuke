<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeNuke Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 550px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #334155;
            text-align: center;
        }

        .banner {
            width: 100%;
            display: block;
            border-bottom: 2px solid #00dc82;
        }

        .content {
            padding: 30px 25px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #00dc82;
        }

        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-verify {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #5865F2;
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
        }

        .btn-verify:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(88, 101, 242, 0.6);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/banner.png" alt="PrimeNuke VERIFY Banner" class="banner">
        <div class="content">
            <h1>Verifizierung Erforderlich</h1>
            <p>Melde dich mit deinem Discord-Konto an, um deine Identität zu verifizieren und vollen Zugriff auf den Server zu erhalten.</p>

                Mit Discord Verifizieren
            </a>
            <div class="footer">
                Sichere Authentifizierung via Discord OAuth2
            </div>
        </div>
    </div>
</body>
</html>
