<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifizierung Erfolgreich</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            border: 1px solid #334155;
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            background-color: rgba(0, 220, 130, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: #00dc82;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1>Erfolgreich Verifiziert!</h1>
        <p>Deine Identität wurde bestätigt. Dir wurde die Rolle <strong>Verifiziert</strong> auf dem Server zugewiesen.</p>
        <p style="margin-top: 15px; font-size: 13px; color: #64748b;">Du kannst dieses Fenster jetzt schließen und zu Discord zurückkehren.</p>
    </div>
</body>
</html>
